<!doctype html>
<html lang="en" data-ui="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Opus Magnum — AR Design</title>
    <meta
      name="description"
      content="Opus Magnum — an immersive visual journey through Jungian individuation and alchemy, from the Nigredo to the Mandala of Wholeness. English · Русский · Español."
    />
    <meta name="theme-color" content="#050506" />
    <meta property="og:title" content="Opus Magnum — AR Design" />
    <meta property="og:description" content="A visual journey into the self: seven stages of Jungian individuation." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <!-- Preloader: a heartbeat line that, once everything is ready, becomes an iris into the first scene -->
    <div id="preloader" role="status" aria-live="polite">
      <div class="pre__content">
        <p class="pre__mark" aria-label="Opus Magnum"><span class="pre__g" aria-hidden="true">Opus Magnum</span><span class="pre__t" aria-hidden="true">Opus Magnum</span></p>
        <svg class="pre__ecg" viewBox="0 0 600 120" aria-hidden="true">
          <path class="pre__ecg-base" pathLength="1" d="M0 60 H178 l14 -8 l12 8 H250 l10 14 l16 -70 l18 92 l12 -36 H352 l12 -10 l14 10 H600" />
          <path class="pre__ecg-run" pathLength="1" d="M0 60 H178 l14 -8 l12 8 H250 l10 14 l16 -70 l18 92 l12 -36 H352 l12 -10 l14 10 H600" />
        </svg>
        <p class="pre__pct"><span id="pre-label">Awakening</span> <b id="pre-pct">0</b>%</p>
        <div class="pre__ui" id="pre-ui" aria-hidden="true">
          <div class="pre__langs" id="pre-langs" role="group" aria-label="Language"></div>
          <button class="pre__enter" id="pre-enter" type="button"><span class="pre__ring" aria-hidden="true"></span><i></i><span class="pre__label">Enter</span></button>
          <button class="pre__snd" id="pre-snd" type="button" aria-pressed="false"><span class="eqb" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="pre__snd-t" id="pre-snd-t">Music</span></button>
        </div>
      </div>
    </div>

    <header id="ui">
      <a class="brand" href="#hero" aria-label="AR Design">AR&nbsp;Design</a>
      <div class="ui__right">
        <button id="map-btn" class="ui__ic" type="button" aria-label="Map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c4-9 7 3 11-5 2-4 4-4 7-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="3.5" cy="17" r="1.8" fill="currentColor"/><circle cx="14" cy="12" r="1.8" fill="currentColor"/><circle cx="20.5" cy="6" r="1.8" fill="currentColor"/></svg></button>
        <button id="soft-btn" class="ui__ic" type="button" aria-pressed="false" aria-label="Gentle mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4C9 4 4 9 4 15c0 2 .7 3.6 1.7 4.6C7 16 10 12.5 15 10c-4 3-6.5 6-7.4 9.6C9 20.3 10.5 21 12 21c6 0 8-6 8-17z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
        <button id="snd" type="button" aria-pressed="false" aria-label="Sound"><i></i><i></i><i></i><i></i></button>
        <div class="lang" id="lang" role="group" aria-label="Language"></div>
      </div>
    </header>

    <nav id="rail" aria-label="Progress">
      <div class="rail__line"><i class="rail__fill"></i></div>
      <ol id="rail-list"></ol>
    </nav>

    <div id="dawn" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="beam" aria-hidden="true"><i></i></div>

    <main id="app"></main>

    <noscript>
      <p style="padding:2rem;color:#eee;font-family:sans-serif">Opus Magnum needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
