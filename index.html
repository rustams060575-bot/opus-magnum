<!doctype html>
<html lang="en" data-ui="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Opus Magnum — AR Design</title>
    <meta
      name="description"
      content="Opus Magnum — an immersive visual journey through Jungian individuation and alchemy, from the Nigredo to the Mandala of Wholeness. English · Русский · Español."
    />
    <meta name="theme-color" content="#050506" />
    <meta property="og:title" content="Opus Magnum — AR Design" />
    <meta property="og:description" content="A visual journey into the self: seven stages of Jungian individuation." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <!-- Preloader: a heartbeat line that, once everything is ready, becomes an iris into the first scene -->
    <div id="preloader" role="status" aria-live="polite">
      <div class="pre__content">
        <p class="pre__mark">Opus Magnum</p>
        <svg class="pre__ecg" viewBox="0 0 600 120" aria-hidden="true">
          <path class="pre__ecg-base" pathLength="1" d="M0 60 H178 l14 -8 l12 8 H250 l10 14 l16 -70 l18 92 l12 -36 H352 l12 -10 l14 10 H600" />
          <path class="pre__ecg-run" pathLength="1" d="M0 60 H178 l14 -8 l12 8 H250 l10 14 l16 -70 l18 92 l12 -36 H352 l12 -10 l14 10 H600" />
        </svg>
        <p class="pre__pct"><span id="pre-label">Awakening</span> <b id="pre-pct">0</b>%</p>
        <div class="pre__ui" id="pre-ui" aria-hidden="true">
          <div class="pre__langs" id="pre-langs" role="group" aria-label="Language"></div>
          <button class="pre__enter" id="pre-enter" type="button"><i></i><span>Enter</span></button>
        </div>
      </div>
    </div>

    <header id="ui">
      <a class="brand" href="#hero" aria-label="AR Design">AR&nbsp;Design</a>
      <div class="lang" id="lang" role="group" aria-label="Language"></div>
    </header>

    <nav id="rail" aria-label="Progress">
      <div class="rail__line"><i class="rail__fill"></i></div>
      <ol id="rail-list"></ol>
    </nav>

    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="beam" aria-hidden="true"><i></i></div>

    <main id="app"></main>

    <noscript>
      <p style="padding:2rem;color:#eee;font-family:sans-serif">Opus Magnum needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
